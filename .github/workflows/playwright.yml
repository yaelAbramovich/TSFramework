name: Playwright tests

# Triggers. Currently manual-only via workflow_dispatch. In addition to manual
# runs, this workflow could also be wired to run on pull_request (e.g. PRs
# targeting main), push (e.g. merges to main or release branches), or schedule
# (cron) for nightly/periodic runs.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run. Select "all" to run everything together.'
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - ui
          - e2e
      # environment:
      #   description: 'Target environment to run against. Each environment has
      #     its own .env file (e.g. .env.dev, .env.staging, .env.prod) that is
      #     loaded before the tests run.'
      #   required: true
      #   type: choice
      #   options:
      #     - dev
      #     - staging
      #     - prod

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Best practice: install only the browsers actually used in CI to
      # save download time and disk. See
      # https://playwright.dev/docs/best-practices#optimize-browser-downloads-on-ci
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A single invocation (either the full suite or one selected project),
      # so exactly one HTML report is produced - running multiple separate
      # `playwright test` invocations would have each one overwrite the
      # previous step's report before it could be uploaded.
      - name: Run tests
        run: npm run test${{ inputs.suite != 'all' && format(':{0}', inputs.suite) || '' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
